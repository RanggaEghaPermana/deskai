name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The system DeskAI is written for, with its Python and GObject versions.
    container: ubuntu:26.04
    steps:
      - name: Install what the tests need
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-atspi-2.0 nodejs appstream
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Everything a change has to pass
        run: |
          git config --global --add safe.directory "$PWD"
          dev/check.sh
